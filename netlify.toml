[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/anthropic/*"
  to = "/.netlify/functions/anthropic-proxy"
  status = 200

[[redirects]]
  from = "/api/rsvp"
  to = "/.netlify/functions/rsvp"
  status = 200

[[redirects]]
  from = "/api/sheets"
  to = "/.netlify/functions/sheets"
  status = 200
